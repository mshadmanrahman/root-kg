[project]
name = "root-kg"
version = "2.1.0"
description = "Personal knowledge graph with entity extraction, GraphRAG, and MCP integration. Turns your notes into searchable intelligence."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Shadman Rahman", email = "connectshadman@gmail.com"},
]
keywords = ["knowledge-graph", "mcp", "rag", "obsidian", "personal-knowledge", "entity-extraction", "semantic-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "sentence-transformers>=3.0.0",
    "sqlite-vec>=0.1.1",
    # 2.x moved handler registration onto the Server constructor; see root_kg/server.py
    "mcp>=2,<3",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/mshadmanrahman/root-kg"
Repository = "https://github.com/mshadmanrahman/root-kg"
Issues = "https://github.com/mshadmanrahman/root-kg/issues"

[project.scripts]
root-kg = "root_kg.cli:main"
root-index = "root_kg.indexer:main"
root-server = "root_kg.server:run"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# Flat layout: the modules live at the repo root, so tell setuptools exactly
# what to ship instead of letting it guess (auto-discovery refuses a flat
# layout with more than one top-level package).
[tool.setuptools.packages.find]
include = ["root_kg*"]

# Setup templates that `root-kg init` copies. They live in the package so a
# PyPI install has them; a checkout reads the same files.
[tool.setuptools.package-data]
root_kg = ["config.example.yaml", ".env.example"]

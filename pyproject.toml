[project]
name = "root-kg"
version = "1.2.1"
description = "Personal knowledge graph with entity extraction, GraphRAG, and MCP integration. Turns your notes into searchable intelligence."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Shadman Rahman", email = "connectshadman@gmail.com"},
]
keywords = ["knowledge-graph", "mcp", "rag", "obsidian", "personal-knowledge", "entity-extraction", "semantic-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "sentence-transformers>=3.0.0",
    "sqlite-vec>=0.1.1",
    "mcp>=1.0.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/mshadmanrahman/root-kg"
Repository = "https://github.com/mshadmanrahman/root-kg"
Issues = "https://github.com/mshadmanrahman/root-kg/issues"

[project.scripts]
root-kg = "cli:main"
root-index = "indexer:main"
root-server = "server:run"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# Flat layout: the modules live at the repo root, so tell setuptools exactly
# what to ship instead of letting it guess (auto-discovery refuses a flat
# layout with more than one top-level package).
[tool.setuptools]
py-modules = [
    "cli",
    "indexer",
    "server",
    "db",
    "extractor",
    "llm",
    "embeddings",
    "chunker",
    "query",
    "rootd",
    "merge_cli",
]
packages = ["adapters", "tools"]
